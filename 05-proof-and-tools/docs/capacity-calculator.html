<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SDR Capacity & Funnel Calculator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 24px; border-radius: 8px; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #38bdf8; }
        label { display: block; margin-top: 12px; font-weight: 600; }
        input { width: 100%; padding: 8px; margin-top: 4px; background: #334155; border: 1px solid #475569; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .result { margin-top: 20px; padding: 12px; background: #0284c7; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>SDR Capacity Calculator</h2>
        <label>Number of SDRs:</label>
        <input type="number" id="sdrs" value="5" oninput="calculate()">
        
        <label>Monthly Dials per SDR:</label>
        <input type="number" id="dials" value="1000" oninput="calculate()">
        
        <label>Connect Rate (%):</label>
        <input type="number" id="connectRate" value="10" oninput="calculate()">
        
        <label>Connect to Meeting Conversion (%):</label>
        <input type="number" id="convRate" value="12" oninput="calculate()">
        
        <div class="result" id="output">Total Projected Meetings / Month: 60</div>
    </div>

    <script>
        function calculate() {
            const sdrs = parseFloat(document.getElementById('sdrs').value) || 0;
            const dials = parseFloat(document.getElementById('dials').value) || 0;
            const connectRate = (parseFloat(document.getElementById('connectRate').value) || 0) / 100;
            const convRate = (parseFloat(document.getElementById('convRate').value) || 0) / 100;
            
            const totalMeetings = Math.round(sdrs * dials * connectRate * convRate);
            document.getElementById('output').innerText = `Total Projected Meetings / Month: ${totalMeetings}`;
        }
    </script>
</body>
</html>
